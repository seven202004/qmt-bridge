name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: pip install -e ".[server,ws]"

      - name: Verify import
        run: python -c "from qmt_bridge import QMTClient; print('import OK')"

      - name: Run tests
        run: python -m pytest tests/ -v
        if: hashFiles('tests/') != ''

  lint:
    name: Lint & type check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and tools
        run: |
          pip install -e ".[server,ws]"
          # 与本地验证过的版本一致：ruff 的默认规则集会随版本变化，
          # 不钉版本的话上游一发新版就可能让 CI 无端变红。
          pip install "ruff==0.16.8" "mypy==2.3.1"

      - name: Run ruff
        run: python -m ruff check src/ tests/ dashboard/

      - name: Run mypy
        run: python -m mypy src/qmt_bridge/
