[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qmt-bridge"
dynamic = ["version"]
description = "HTTP/WebSocket bridge for miniQMT (xtquant) — market data & trading API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "QMT Bridge Contributors" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
]

# Base install has zero dependencies (client-only, stdlib)
dependencies = []

[project.optional-dependencies]
server = [
    "fastapi>=0.100",
    "uvicorn[standard]>=0.20",
    "pandas>=1.5",
    "numpy>=1.23",
    # xtdata.get_sector_info() / metatable 走 pyarrow.feather 读写
    # （xtdata.py 内部 `from pyarrow import feather`），缺失会让 /api/sector/info 等端点 500
    "pyarrow>=14",
]
pandas = ["pandas>=1.5"]
ws = ["websockets>=11.0"]
client = ["websockets>=11.0"]
notify = ["httpx>=0.25"]
scripts = ["tqdm>=4.60"]
full = [
    "qmt-bridge[server,ws,notify,scripts]",
]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.0",
    "mkdocstrings[python]>=0.24",
    "pdoc>=14.0",
]
dashboard = [
    "streamlit>=1.30",
    "plotly>=5.18",
    "pandas>=1.5",
]

[project.scripts]
qmt-server = "qmt_bridge.server.cli:main"
qmt-scheduler = "qmt_bridge.server.cli:scheduler_main"

[project.urls]
Homepage = "https://github.com/atompilot/qmt-bridge"
Repository = "https://github.com/atompilot/qmt-bridge"

[tool.hatch.version]
path = "src/qmt_bridge/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/qmt_bridge"]

[tool.hatch.build.targets.sdist]
include = ["src/qmt_bridge", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.mypy]
# 让检查覆盖"没写注解的函数体"：否则项目里大量未标注函数等于逃过类型检查。
check_untyped_defs = true
# 过期/多余的 type: ignore 与无意义的 cast 本身就是错误信息，别留着误导人。
warn_unused_ignores = true
warn_redundant_casts = true
# 不同类型之间比较通常是笔误（如 str 与 int）。
strict_equality = true
# 不开 warn_return_any：xtquant 没有 stub，返回值天然是 Any，开了就是 60 条噪音。
# xtquant / bson 随 miniQMT 客户端分发（PyPI 上没有，也没有 stub），
# httpx 只在通知模块按需导入，pandas 无 stub。
# 这些"找不到实现/缺 stub"的噪音会把真正的类型错误淹掉，统一忽略。
[[tool.mypy.overrides]]
module = ["xtquant", "xtquant.*", "bson", "httpx", "pandas"]
ignore_missing_imports = true

[tool.ruff.lint.flake8-bugbear]
# FastAPI 的依赖注入就写在默认参数里（Depends/Security/Query…），B008 在此全是误报。
# 列在 extend-immutable-calls 里 = 告诉 ruff「这些调用是常量，不是每次调用重新求值」。
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Cookie",
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Query",
    "fastapi.Security",
]

[tool.ruff.lint.per-file-ignores]
# 行情时间戳统一是 A 股本地 naive 时间（xtdata 返回的日期字符串也是这个口径），
# 改成 tz-aware 反而与 xtdata 互操作对不上，所以只在本文件豁免 DTZ。
"src/qmt_bridge/server/downloader.py" = ["DTZ005", "DTZ006", "DTZ007"]
# 仪表盘每个交互按钮都要"失败也留在页面上"：异常类型无从穷举（客户端/数据解析/
# 界面），统一由 _sidebar.report_error() 记录并展示，所以这里豁免盲 except。
# DTZ011 同理：日期选择器的默认值就是本地日历日，不需要时区。
"dashboard/**" = ["BLE001", "DTZ011"]
